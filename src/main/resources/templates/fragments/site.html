<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="border-b border-line" th:fragment="header(homeUrl, otherRendererUrl, currentRenderer)">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-5">
        <a class="flex min-w-0 items-center gap-3 text-primary no-underline" th:href="${homeUrl}">
            <!--/* The klibs.io wordmark is white, so it sits on its own plate in both themes. */-->
            <span class="brand-plate grid h-9 shrink-0 place-items-center rounded-xl px-3">
                <img class="h-4 w-auto" src="/assets/klibs-logo.svg" alt="Klibs.io" width="124" height="21">
            </span>
            <p class="hidden text-xs text-subtle sm:block">Server-rendered explorer</p>
        </a>

        <div class="flex shrink-0 items-center gap-2">
            <button class="inline-flex items-center gap-2 rounded-full border border-line-strong bg-surface px-3 py-2 text-xs font-semibold text-muted transition hover:border-accent hover:text-primary"
                    type="button" data-theme-toggle="true" aria-label="Toggle color theme" title="Toggle color theme">
                <span data-theme-toggle-icon="true" aria-hidden="true">☾</span>
                <span class="hidden md:inline" data-theme-toggle-label="true">Theme</span>
            </button>

            <!--/* Both renderers keep the same position, so only the highlight moves when switching. */-->
            <div class="inline-flex shrink-0 items-center gap-1 rounded-full border border-line-strong bg-surface p-1"
                 role="group" aria-label="Server-side HTML renderer">
                <span class="rounded-full bg-accent-solid px-3 py-1.5 text-xs font-bold text-accent-ink"
                      th:if="${currentRenderer == 'Compose HTML'}"
                      aria-current="page"
                      th:attr="data-current-renderer=${currentRenderer}">Compose HTML</span>
                <a class="rounded-full px-3 py-1.5 text-xs font-semibold text-muted no-underline transition hover:text-primary"
                   th:unless="${currentRenderer == 'Compose HTML'}"
                   th:href="${otherRendererUrl}"
                   aria-label="Switch to Compose HTML">Compose HTML</a>

                <span class="rounded-full bg-accent-solid px-3 py-1.5 text-xs font-bold text-accent-ink"
                      th:if="${currentRenderer == 'Thymeleaf'}"
                      aria-current="page"
                      th:attr="data-current-renderer=${currentRenderer}">Thymeleaf</span>
                <a class="rounded-full px-3 py-1.5 text-xs font-semibold text-muted no-underline transition hover:text-primary"
                   th:unless="${currentRenderer == 'Thymeleaf'}"
                   th:href="${otherRendererUrl}"
                   aria-label="Switch to Thymeleaf">Thymeleaf</a>
            </div>
        </div>
    </div>
</header>

<footer class="border-t border-line" th:fragment="footer">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-6 py-8 text-xs text-subtle sm:flex-row sm:items-center sm:justify-between">
        <p>One Spring model. Two server-side HTML renderers.</p>
        <p>Live data: klibs.io MCP / searchProjects</p>
    </div>
</footer>
</body>
</html>
