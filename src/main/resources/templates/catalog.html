<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KMP Library Finder</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
</head>
<body class="min-h-screen bg-canvas font-sans text-primary antialiased" data-renderer="thymeleaf">
<div class="page-glow fixed inset-0 -z-10"></div>

<header th:replace="~{fragments/site :: header(homeUrl=${formAction}, otherRendererUrl=${otherRendererUrl}, currentRenderer='Thymeleaf')}"></header>

<main class="mx-auto max-w-6xl px-6 py-14 sm:py-20">
    <section th:replace="~{fragments/catalog :: searchHero(query=${page.query}, formAction=${formAction})}"></section>
    <div th:replace="~{fragments/catalog :: warningBanner(message=${page.warning})}"></div>
    <th:block th:if="${page.featured}">
        <div th:replace="~{fragments/featured :: featuredCatalog(categories=${page.categories})}"></div>
    </th:block>
    <th:block th:unless="${page.featured}">
        <section th:replace="~{fragments/catalog :: projectCatalog(projects=${page.projects}, status=${page.status})}"></section>
    </th:block>
</main>

<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
