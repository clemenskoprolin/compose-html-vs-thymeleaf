<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="max-w-3xl" th:fragment="searchHero(page, formAction)">
    <p class="mb-5 text-sm font-bold uppercase tracking-[0.22em] text-accent">Kotlin Multiplatform, indexed</p>
    <h1 class="text-4xl font-black leading-tight tracking-tight text-primary sm:text-6xl">Find the library that gets you to the interesting part.</h1>
    <p class="mt-6 max-w-2xl text-lg leading-8 text-muted">Search verified project and package metadata from klibs.io through its public MCP server.</p>

    <!--/* Both renderers submit the same ordinary GET request and return a complete HTML page. */-->
    <form class="mt-9" method="get" th:action="${formAction}">
        <div class="flex flex-col gap-3 rounded-2xl border border-line bg-surface-raised p-3 shadow-2xl shadow-shadow sm:flex-row">
            <input class="min-w-0 flex-1 rounded-xl border border-line bg-input px-5 py-3.5 text-base text-primary outline-none placeholder:text-subtle focus:border-accent"
                   type="search" name="query" th:value="${page.query}"
                   placeholder="Try html, navigation, database…"
                   aria-label="Search Kotlin Multiplatform projects"
                   autocomplete="off">
            <button class="rounded-xl bg-accent-solid px-7 py-3.5 text-sm font-black text-accent-ink transition hover:bg-accent-hover"
                    type="submit">Search projects</button>
        </div>
        <input type="hidden" name="platforms" th:each="selectedPlatform : ${page.platforms}"
               th:value="${selectedPlatform}">

        <div class="mt-5 flex flex-wrap items-center gap-2" role="group" aria-label="Platform filter">
            <p class="mr-1 text-xs font-bold uppercase tracking-[0.16em] text-subtle">Platforms</p>
            <a class="inline-flex items-center gap-1 rounded-full border px-3 py-1.5 text-xs font-semibold no-underline transition"
               th:each="platform : ${page.platformFilters}"
               th:classappend="${page.isPlatformSelected(platform)} ? 'border-accent-line bg-accent-solid text-accent-ink' : 'border-line-strong bg-surface text-muted hover:border-accent hover:text-primary'"
               th:href="${page.platformUrl(formAction, platform)}"
               th:attr="aria-label=${platform.label + ' platform, ' + (page.isPlatformSelected(platform) ? 'selected; activate to remove' : 'activate to add')}"><span
                    aria-hidden="true" th:if="${page.isPlatformSelected(platform)}">✓</span><th:block
                    th:text="${platform.label}"></th:block></a>
        </div>
    </form>
</section>

<div class="mt-8 rounded-2xl border border-warning-line bg-warning-soft px-5 py-4 text-sm text-warning"
     role="status"
     th:fragment="warningBanner(message)"
     th:if="${message != null}"
     th:text="${message}"></div>

<section class="mt-14" th:fragment="projectCatalog(page, formAction)" th:with="projects=${page.projects},status=${page.status}">
    <div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="text-xs font-bold uppercase tracking-[0.2em] text-secondary">Catalog</p>
            <h2 class="mt-2 text-2xl font-black text-primary">Projects worth opening</h2>
        </div>
        <p class="text-sm text-subtle" th:text="${status}"></p>
    </div>

    <div class="rounded-3xl border border-dashed border-line-strong px-6 py-14 text-center text-subtle"
         th:if="${#lists.isEmpty(projects)}">Try a broader search term.</div>

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" th:unless="${#lists.isEmpty(projects)}">
        <th:block th:each="project : ${projects}">
            <a th:replace="~{fragments/catalog :: projectCard(project=${project}, href=${page.projectUrl(formAction, project.author, project.name)})}"></a>
        </th:block>
    </div>
</section>

<!--/* A live-search result using the same compact information hierarchy as the home cards. */-->
<a class="group flex h-full min-w-0 flex-col justify-between gap-5 rounded-2xl border border-line bg-card p-4 no-underline transition hover:-translate-y-0.5 hover:border-accent-line hover:bg-card-hover"
   th:fragment="projectCard(project, href)"
   th:href="${href}">
    <div>
        <div class="min-w-0">
            <p class="text-xs font-semibold text-subtle" th:text="${'by ' + project.author}"></p>
            <h3 class="mt-2 break-words text-lg font-black text-primary" th:text="${project.name}"></h3>
        </div>

        <p class="project-card-description mt-3 text-sm leading-6 text-muted"
           th:if="${!project.description.isBlank()}" th:text="${project.description}"></p>

        <div class="mt-4" th:if="${!project.displayedPlatforms.isEmpty()}">
            <div class="flex flex-wrap gap-1.5">
                <span class="rounded-md border border-line bg-surface px-2 py-1 text-[10px] font-semibold text-muted"
                      th:each="platform : ${project.displayedPlatforms}" th:text="${platform}"></span>
            </div>
        </div>
    </div>

    <p class="flex items-center justify-between text-xs font-bold text-accent">
        View details<span aria-hidden="true">↗</span>
    </p>
</a>
</body>
</html>
