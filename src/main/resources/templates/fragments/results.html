<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The catalog content produced as part of every complete server-rendered page. */-->
<div id="catalog-results" th:fragment="results">
    <div th:replace="~{fragments/results :: topTagRail}"></div>
    <div th:replace="~{fragments/catalog :: warningBanner(message=${page.warning})}"></div>
    <th:block th:if="${page.featured}">
        <div th:replace="~{fragments/featured :: featuredCatalog(page=${page}, formAction=${formAction})}"></div>
    </th:block>
    <th:block th:unless="${page.featured}">
        <section th:replace="~{fragments/catalog :: projectCatalog(page=${page}, formAction=${formAction})}"></section>
    </th:block>
</div>

<!--/* Shortcut searches, as klibs.io lists them above its catalog. */-->
<div class="mt-6 flex flex-wrap items-center gap-2"
     th:fragment="topTagRail"
     th:if="${!#lists.isEmpty(page.topTags)}"
     aria-label="Top tags">
    <p class="mr-1 text-xs font-bold uppercase tracking-[0.16em] text-subtle">Top tags</p>

    <a class="inline-flex items-center rounded-full border px-3 py-1.5 text-xs font-semibold no-underline transition"
       th:classappend="${#strings.isEmpty(page.query) ? 'border-accent-line bg-accent-solid text-accent-ink' : 'border-line-strong bg-surface text-muted hover:border-accent hover:text-primary'}"
       th:href="${page.searchUrl(formAction, '')}"
       th:attr="aria-current=${#strings.isEmpty(page.query) ? 'page' : null}">All</a>

    <a class="inline-flex items-center rounded-full border px-3 py-1.5 text-xs font-semibold no-underline transition"
       th:each="tag : ${page.topTags}"
       th:classappend="${tag == page.query ? 'border-accent-line bg-accent-solid text-accent-ink' : 'border-line-strong bg-surface text-muted hover:border-accent hover:text-primary'}"
       th:href="${page.searchUrl(formAction, tag)}"
       th:attr="aria-current=${tag == page.query ? 'page' : null}"
       th:text="${tag}"></a>
</div>
</body>
</html>
