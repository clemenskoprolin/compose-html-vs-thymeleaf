<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="featuredCatalog(categories)">
    <th:block th:each="category, categoryStat : ${categories}">
        <section class="mt-14 sm:mt-20" th:attr="data-category=${category.slug}">
            <div class="mb-6 flex items-end justify-between gap-4">
                <h2 class="text-2xl font-black tracking-tight text-primary" th:text="${category.title}"></h2>
                <a class="inline-flex shrink-0 items-center gap-2 text-sm font-bold text-accent no-underline hover:text-primary"
                   th:href="${category.url}">See all <span aria-hidden="true">→</span></a>
            </div>
            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                <a class="group flex h-full min-w-0 flex-col justify-between gap-5 rounded-2xl border bg-card p-4 no-underline transition hover:-translate-y-0.5 hover:border-accent-line hover:bg-card-hover"
                   th:classappend="${project.grantWinner} ? 'border-accent-line' : 'border-line'"
                   th:each="project : ${category.projects}"
                   th:href="${project.url}"
                   th:attr="data-star-count=${project.stars}">
                    <div>
                        <div class="flex items-start justify-between gap-4">
                            <div class="min-w-0">
                                <p class="text-xs font-semibold text-subtle">by <span th:text="${project.author}"></span></p>
                                <h3 class="mt-2 break-words text-lg font-black text-primary" th:text="${project.name}"></h3>
                            </div>
                            <p class="inline-flex shrink-0 items-center gap-1 rounded-full bg-code px-2.5 py-1 text-xs font-bold text-muted">
                                <span class="text-accent" aria-hidden="true">★</span>
                                <span th:text="${project.stars}"></span>
                            </p>
                        </div>
                        <p class="ranked-project-description mt-3 text-sm leading-6 text-muted"
                           th:if="${!project.description.isBlank()}" th:text="${project.description}"></p>
                        <p class="mt-3 inline-flex rounded-full bg-secondary-soft px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide text-secondary"
                           th:if="${project.grantWinner}">Kotlin Grant winner</p>
                        <div class="mt-3 flex flex-wrap gap-1.5" th:if="${!project.displayedTags.isEmpty()}">
                            <span class="rounded-full bg-secondary-soft px-2.5 py-1 text-[11px] font-bold text-secondary"
                                  th:each="tag : ${project.displayedTags}" th:text="${tag}"></span>
                            <span class="px-1 py-1 text-[11px] font-bold text-subtle"
                                  th:if="${project.additionalTagCount > 0}"
                                  th:text="${'+' + project.additionalTagCount}"></span>
                        </div>
                        <div class="mt-4" th:if="${!project.displayedPlatforms.isEmpty()}">
                            <div class="flex flex-wrap gap-1.5">
                                <span class="rounded-md border border-line bg-surface px-2 py-1 text-[10px] font-semibold text-muted"
                                      th:each="platform : ${project.displayedPlatforms}" th:text="${platform}"></span>
                            </div>
                        </div>
                    </div>
                    <p class="flex items-center justify-between text-xs font-bold text-accent">
                        <span>View on klibs.io</span><span aria-hidden="true">↗</span>
                    </p>
                </a>
            </div>
        </section>

        <section class="grant-banner mt-14 overflow-hidden rounded-3xl border border-accent-line p-7 sm:mt-20"
                 th:if="${categoryStat.index == 0}">
            <div class="max-w-2xl">
                <p class="mb-5 text-xs font-bold uppercase tracking-[0.2em] text-accent">Kotlin Foundation</p>
                <h2 class="text-4xl font-black leading-tight tracking-tight text-primary">Kotlin Grant Winners</h2>
                <p class="mt-4 text-base leading-6 text-muted">Explore top-tier projects funded for pushing Multiplatform development forward.</p>
                <div class="mt-8 flex flex-wrap gap-3">
                    <a class="inline-flex items-center gap-2 rounded-full border border-accent bg-accent-solid px-5 py-2.5 text-sm font-bold text-accent-ink no-underline transition hover:-translate-y-0.5"
                       href="https://klibs.io/?category=grant-winners">Discover projects <span aria-hidden="true">→</span></a>
                    <a class="inline-flex items-center gap-2 rounded-full border border-line-strong bg-surface px-5 py-2.5 text-sm font-bold text-primary no-underline transition hover:-translate-y-0.5"
                       href="https://kotlinfoundation.org/grants/">Learn about grants <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </section>
    </th:block>
</div>
</body>
</html>
